services:
  - type: web
    name: bsc-exclusive-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node node_modules/.next/standalone/server.js
    env:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main

  - type: worker
    name: bsc-exclusive-worker
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx backend/workers/cron-worker.ts
    env:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
    autoDeploy: true
    branch: main
