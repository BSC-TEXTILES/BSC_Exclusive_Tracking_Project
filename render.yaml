services:
  - type: web
    name: bsc-exclusive-tracking
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    env:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: "BSC Exclusive"
      - key: NEXT_PUBLIC_APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: FILE_STORAGE_TYPE
        value: "local"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MAX_FILE_SIZE_MB
        value: "10"
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
